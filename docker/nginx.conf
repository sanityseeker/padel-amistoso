worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Real client IP from Cloudflare's proxied request.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   CF-Connecting-IP;

    # Request timing in the access log: $request_time is the full client
    # round trip, $upstream_response_time is what the FastAPI app took.
    # A slow endpoint shows up here as a large upstream time; a slow client
    # or network as a large gap between the two.
    log_format timed '$remote_addr - $host "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout timed;

    # Keep persistent connections to the upstreams instead of opening a new
    # TCP connection per proxied request. Requires HTTP/1.1 and a cleared
    # Connection header (set in the location blocks below).
    upstream padel_app {
        server padel:8000;
        keepalive 32;
    }

    upstream padel_demo_app {
        server padel-demo:8000;
        keepalive 8;
    }

    # Proxy defaults. Response buffering stays ON (nginx default) so slow
    # clients don't pin upstream connections; the app's SSE endpoints opt
    # out per-response via "X-Accel-Buffering: no", which nginx honors.
    # The long read timeout is what keeps idle SSE streams alive.
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Demo instance — a fully separate container + database (see the
    # padel-demo service in docker-compose.nas.yml). Matched first, before
    # the wildcard default below. Change the hostname if your domain differs.
    server {
        listen 80;
        server_name demo.amistoso.club;

        client_max_body_size 16m;

        location / {
            proxy_pass         http://padel_demo_app;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
        }
    }

    # Wildcard host: the apex and any club subdomain are forwarded to the
    # core FastAPI app. The app uses the Host header to pick the right page
    # (admin / club / etc.).
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 16m;

        location / {
            proxy_pass         http://padel_app;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
        }
    }
}

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Real client IP from Cloudflare's proxied request.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   CF-Connecting-IP;

    # Buffering / proxy timeouts suitable for SSE.
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Demo instance — a fully separate container + database (see the
    # padel-demo service in docker-compose.nas.yml). Matched first, before
    # the wildcard default below. Change the hostname if your domain differs.
    server {
        listen 80;
        server_name demo.amistoso.club;

        client_max_body_size 16m;

        location / {
            proxy_pass         http://padel-demo:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
        }
    }

    # Wildcard host: the apex and any club subdomain are forwarded to the
    # core FastAPI app. The app uses the Host header to pick the right page
    # (admin / club / etc.).
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 16m;

        location / {
            proxy_pass         http://padel:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
        }
    }
}

services:
  - type: web
    name: padel-tournament-manager
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PADEL_JWT_SECRET
        generateValue: true
      - key: PADEL_ADMIN_PASSWORD
        value: "admin"
      - key: DEMO_MODE
        value: "true"
      # The Render hostname's leftmost label ("padel-amistoso") looks like a
      # club slug, so the subdomain router would treat "/" as an unknown club
      # and 404 unless it knows this IS the apex. Pin the full host here so it
      # never depends on a dashboard value that a blueprint sync can drop.
      - key: AMISTOSO_DOMAIN
        value: "padel-amistoso.onrender.com"
      - key: ALLOWED_ORIGINS
        value: "https://padel-amistoso.onrender.com"
    healthCheckPath: /api/tournaments
    autoDeploy: true

# Note: Free tier spins down after 15 minutes of inactivity
# First request after spin-down takes ~30 seconds to wake up
# Data stored in memory/pickle will be lost on each spin-down

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="txt_txt_app_title">Torneos</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a5fa3">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');</script>
<script>(function(){try{var t=localStorage.getItem('amistoso-theme')||localStorage.getItem('padel-theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(_){}})();</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/tv.css">
<link rel="stylesheet" href="/club.css">
<script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" integrity="sha384-G3VE2R9nao/dKH0R46Bvk6qIVBAeImWjeTj+SwWOJzJ4N0vQ2RKWuC/cp36l4Iba" crossorigin="anonymous" defer></script>
</head>
<body>
<div id="tv-root">
  <div class="tv-loading" data-i18n="txt_txt_loading_tournament_display">Loading tournament display…</div>
</div>
<!-- Events directory card template (inert until instantiated per item by
     _renderPickerHtml → #tv-picker-island, tv.js). `it` is the per-item
     view-model from _pickerStore.item(). Same card as the club page. -->
<template id="tpl-tv-picker-item">
  <a class="club-item-card" :class="['club-item-card--' + it.status, it.pinned ? 'club-item-card--pinned' : '']" :href="it.href">
    <span class="club-item-name">{{ it.name }}<span v-if="it.origin" class="club-item-origin">{{ it.origin }}</span></span>
    <span class="club-item-badges">
      <span v-for="b in it.badges" :key="b.cls" class="club-item-badge" :class="b.cls">{{ b.label }}</span>
    </span>
  </a>
</template>
<div class="support-links">
  <a href="https://ko-fi.com/torneosamistosos" target="_blank" rel="noopener" class="support-link support-link--coffee">
    <svg width="16" height="16" viewBox="0 0 24 24" class="support-link__heart" aria-hidden="true"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.963 1.904.82 2.058 3.034.556 4.303zm6.173.478c-.928.116-1.682.028-1.682.028V7.284h1.77s1.971.551 1.971 2.638c0 1.913-.985 2.667-2.059 3.015z"/></svg>
    Buy me a coffee
  </a>
  <a href="https://github.com/sanityseeker/padel-amistoso" target="_blank" rel="noopener" class="support-link support-link--github">
    <svg width="16" height="16" viewBox="0 0 16 16" class="support-link__icon" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.67 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    Contribute on GitHub
  </a>
</div>
<div id="abbrev-popup" role="tooltip"></div>
<!-- Player score-format popover (Petite-Vue island, _psFmtStore in tv.js).
     Outside #tv-root so live re-renders never destroy it. -->
<div id="ps-format-popover" class="match-format-popover" v-scope hidden :hidden="!open"
     role="dialog" :aria-label="t('txt_match_format_btn_label')"
     :style="{ top: top + 'px', left: left + 'px' }">
  <div class="mf-head">
    <span class="mf-title">{{ t('txt_match_format_btn_label') }}</span>
    <button type="button" class="mf-close" :aria-label="t('txt_txt_close')" @click="close()">✕</button>
  </div>
  <p class="mf-line">{{ t('txt_tv_format_set_by_organiser', { value: label(defaultFmt) }) }}</p>
  <div class="mf-options" role="group" :aria-label="t('txt_match_format_btn_label')">
    <button v-for="f in ['points', 'sets', 'sets_tb']" :key="f" type="button" class="mf-option"
            :class="{ active: fmt === f }" :aria-pressed="fmt === f" @click="choose(f)">
      <span>{{ label(f) }}</span>
      <span v-if="f === defaultFmt" class="mf-option-tag">{{ t('txt_tv_format_organiser_tag') }}</span>
    </button>
  </div>
  <p class="mf-hint">{{ t('txt_tv_format_other_hint') }}</p>
</div>

<div id="bracket-lightbox" role="dialog" aria-modal="true" aria-label="Bracket" data-i18n-aria-label="txt_txt_bracket" onclick="_closeBracketLightbox(event)">
  <div class="bracket-lb-toolbar" onclick="event.stopPropagation()">
    <button class="bracket-lb-btn" onclick="_bracketLightboxZoomOut()" aria-label="Zoom out" data-i18n-aria-label="txt_txt_zoom_out" title="Zoom out" data-i18n-title="txt_txt_zoom_out">−</button>
    <button class="bracket-lb-btn bracket-lb-zoom-lbl" id="bracket-lb-zoom-level" onclick="_bracketLightboxZoomReset()" aria-label="Reset zoom" data-i18n-aria-label="txt_txt_reset_zoom" title="Reset zoom" data-i18n-title="txt_txt_reset_zoom">100%</button>
    <button class="bracket-lb-btn" onclick="_bracketLightboxZoomIn()" aria-label="Zoom in" data-i18n-aria-label="txt_txt_zoom_in" title="Zoom in" data-i18n-title="txt_txt_zoom_in">+</button>
    <button class="bracket-lb-btn" onclick="_bracketLightboxOpenFull()" aria-label="Open original image" data-i18n-aria-label="txt_txt_open_original_image" title="Open original image" data-i18n-title="txt_txt_open_original_image">↗</button>
    <button class="bracket-lb-btn" onclick="_bracketLightboxDownload()" aria-label="Download image" data-i18n-aria-label="txt_txt_download_image" title="Download image" data-i18n-title="txt_txt_download_image">⬇</button>
    <button class="bracket-lb-btn bracket-lb-close-btn" onclick="_closeBracketLightbox()" aria-label="Close" data-i18n-aria-label="txt_txt_close" title="Close (Esc)" data-i18n-title="txt_txt_close_esc">✕</button>
  </div>
  <div class="bracket-lightbox-scroll">
    <img id="bracket-lightbox-img" src="" alt="Bracket" data-i18n-alt="txt_txt_bracket">
  </div>
</div>


<script src="/i18n.js" defer></script>
<script src="/shared.js" defer></script>
<script src="/tv.js" defer></script>

</body>
</html>

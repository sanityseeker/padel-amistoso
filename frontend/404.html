<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="txt_txt_404_page_title">404 – Page Not Found</title>
<!-- Injected by the server: the right "home" for the host this page was served on
     (club landing page on a club subdomain, the platform apex otherwise). -->
<meta name="amistoso-home" content="__HOME_URL__">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a5fa3">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>(function(){try{var t=localStorage.getItem('amistoso-theme')||localStorage.getItem('padel-theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(_){}})();</script>
<link rel="preconnect" href="https://api.fontshare.com">
<!-- One request per family: the Fontshare API only returns the first family of a combined f[] query. -->
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-5);
    padding: var(--space-8) var(--space-4);
    text-align: center;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
  }
  img#error-img {
    max-width: min(320px, 80vw);
    height: auto;
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-md);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    letter-spacing: -0.01em;
    color: var(--color-text);
  }
  .context-msg {
    max-width: 40rem;
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-warning-border);
    border-radius: var(--radius-card);
    background: var(--color-warning-bg);
    color: var(--color-warning-text);
    font-size: 0.95rem;
  }
  .countdown {
    font-size: 0.95rem;
    color: var(--color-text-muted);
  }
  .countdown span#counter {
    font-family: var(--font-data);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--color-primary);
  }
  a.home-link {
    display: inline-block;
    padding: var(--space-3) var(--space-6);
    border-radius: var(--radius-full);
    background: var(--color-primary);
    color: var(--color-on-primary);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  a.home-link:hover { background: var(--color-primary-hover); }
  a.home-link:active { background: var(--color-primary-active); }
</style>
</head>
<body>
  <img id="error-img" src="/404.png" alt="404 – Page not found" data-i18n-alt="txt_txt_404_image_alt">
  <h1 data-i18n="txt_txt_404_page_title">404 – Page Not Found</h1>
  <p id="context-msg" class="context-msg" hidden></p>
  <p id="countdown" class="countdown" hidden><span data-i18n="txt_txt_redirecting_home_in">Redirecting to home in</span> <span id="counter">5</span> <span data-i18n="txt_txt_seconds_ellipsis">seconds…</span></p>
  <a id="home-link" class="home-link" href="/" data-i18n="txt_txt_go_home_now">Go home now</a>

<script>
  // The server injects the correct home for this hostname (see
  // ``_home_url_for`` in backend/api/__init__.py): a club subdomain goes back
  // to the club landing page, anything else to the platform apex. Only fall
  // back to this origin's root when the page was served without injection.
  function _serverHomeUrl() {
    var meta = document.querySelector('meta[name="amistoso-home"]');
    var v = meta && meta.getAttribute('content') || '';
    if (!v || v.indexOf('__HOME_URL__') !== -1 || !/^https?:\/\//.test(v)) return null;
    return v;
  }
  var _home = _serverHomeUrl();
  var params = new URLSearchParams(window.location.search);
  var context = params.get('m');
  var redirectTarget = params.get('to') || _home || (window.location.origin + '/');
  if (context) {
    var contextEl = document.getElementById('context-msg');
    contextEl.textContent = context;
    contextEl.hidden = false;
  }
  document.getElementById('home-link').setAttribute('href', redirectTarget);

  // Auto-redirect only when we know where home is and it is not this very
  // page — otherwise we would loop on an unknown subdomain's root.
  var _here = window.location.origin + window.location.pathname;
  if ((params.get('to') || _home) && redirectTarget !== _here) {
    document.getElementById('countdown').hidden = false;
    var seconds = 5;
    var el = document.getElementById('counter');
    var timer = setInterval(function () {
      seconds -= 1;
      el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(redirectTarget);
      }
    }, 1000);
  }
</script>
<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>initLanguage();</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');</script>
</body>
</html>
